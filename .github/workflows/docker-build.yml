name: Docker Build & Push

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "docs/**", "docs_site/**", "mkdocs.yml", "LICENSE", ".pre-commit-config.yaml"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, SAST & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Run Ruff Formatter Check
        run: ruff format --check app/ tests/

      - name: Run Ruff Linter
        run: ruff check app/ tests/

      - name: Run Bandit SAST Scan
        run: bandit -r app/ -c .bandit

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
        run: pytest tests/ -v --cov=app --cov-fail-under=35

  build:
    name: Docker Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: webyhomelab/power-safety-ua
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build PR candidate image
        if: github.event_name == 'pull_request'
        id: build_pr
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: power-safety-ua:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push release image
        if: github.event_name != 'pull_request'
        id: build_release
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Determine scan target image
        id: scan_target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=power-safety-ua:ci-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "image=webyhomelab/power-safety-ua@${{ steps.build_release.outputs.digest }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Trivy vulnerability scanner (FS)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore

      - name: Run Trivy image scanner (Hard vulnerability gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.scan_target.outputs.image }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Generate SBOM (SPDX JSON)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: webyhomelab/power-safety-ua@${{ steps.build_release.outputs.digest }}
          format: spdx-json
          output: power-safety-ua-${{ github.ref_name }}-sbom.spdx.json

      - name: Upload SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" "power-safety-ua-${{ github.ref_name }}-sbom.spdx.json" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
